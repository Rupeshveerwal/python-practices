<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Minifier Clone</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --surface: #FFFFFF;
            --text: #1F2937;
            --border: #D1D5DB;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: var(--text);
            text-align: center;
            margin-bottom: 25px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: var(--surface);
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .editor-grid {
                grid-template-columns: 1fr;
            }
        }

        .editor-col {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #4B5563;
        }

        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            font-family: "Fira Code", monospace;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            resize: vertical;
            background-color: #F9FAFB;
            box-sizing: border-box;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
            background-color: var(--surface);
        }

        .copy-btn {
            position: absolute;
            top: 35px;
            right: 15px;
            background: #10B981;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .copy-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Code Minifier</h1>
        
        <div class="toolbar">
            <select id="languageSelect">
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>
                <option value="html">HTML</option>
            </select>
            <button class="btn" onclick="minify()">Minify Code 🚀</button>
        </div>

        <div class="editor-grid">
            <div class="editor-col">
                <label for="inputCode">Input</label>
                <textarea id="inputCode" placeholder="Paste your raw code here..."></textarea>
            </div>
            
            <div class="editor-col">
                <label for="outputCode">Output</label>
                <textarea id="outputCode" placeholder="Minified code will appear here..." readonly></textarea>
                <button class="btn copy-btn" onclick="copyCode()">Copy</button>
            </div>
        </div>
    </div>

    <script>
        function minify() {
            const lang = document.getElementById('languageSelect').value;
            let code = document.getElementById('inputCode').value;
            const output = document.getElementById('outputCode');

            if (!code.trim()) {
                output.value = '';
                return;
            }

            try {
                if (lang === 'css') {
                    code = code
                        .replace(/\/\*[\s\S]*?\*\//g, '')          // Remove comments
                        .replace(/\s+/g, ' ')                      // Collapse whitespace
                        .replace(/\s*([\{\}\:\;\,])\s*/g, '$1')    // Remove spaces around syntax
                        .trim();
                } else if (lang === 'js') {
                    code = code
                        .replace(/\/\*[\s\S]*?\*\//g, '')          // Remove multi-line comments
                        .replace(/\/\/.*$/gm, '')                  // Remove single-line comments
                        .replace(/\s+/g, ' ')                      // Collapse whitespace
                        .replace(/\s*([\{\}\(\)\=\+\-\*\/\:\;\,\<\>\&\|])\s*/g, '$1') // Remove spaces around syntax
                        .trim();
                } else if (lang === 'html') {
                    code = code
                        .replace(/<!--[\s\S]*?-->/g, '')           // Remove HTML comments
                        .replace(/\s+/g, ' ')                      // Collapse whitespace
                        .replace(/>\s+</g, '><')                   // Remove space between tags
                        .trim();
                }
                output.value = code;
            } catch (error) {
                output.value = "Error parsing code. Please check your syntax.";
            }
        }

        function copyCode() {
            const output = document.getElementById('outputCode');
            if (output.value) {
                output.select();
                document.execCommand('copy');
                
                // Temporary visual feedback
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.innerText;
                btn.innerText = 'Copied! ✓';
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 2000);
            }
        }
    </script>
</body>
</html>
